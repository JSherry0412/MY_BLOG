<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博客编辑器</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="editor.css"></head><body><main class="editor-shell"><header class="editor-header"><div><div class="eyebrow"><span></span> YOUR PERSONAL SPACE</div><h1>博客编辑器</h1><p>这里单独管理博客资料和内容。修改保存在本机博客文件中。</p></div><a class="button secondary" href="/" target="_blank" rel="noopener">打开博客 ↗</a></header><nav class="editor-nav" aria-label="编辑器栏目"><button data-panel="profile" class="selected">个人资料</button><button data-panel="posts">文章</button><button data-panel="moments">动态</button><button data-panel="albums">照片墙</button><button data-panel="projects">项目与收藏</button><button data-panel="about">关于</button></nav><div id="notice" role="status" aria-live="polite"></div><section class="editor-panel glass" id="profile"><h2>个人资料</h2><p>你的头像、名字、签名和标签都可以稍后填写。</p><form id="profile-form"><div class="avatar-edit"><div id="avatar-preview" class="profile-avatar">✳</div><div><label class="upload-button" for="avatar-file">选择头像</label><input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><button type="button" id="remove-avatar" class="text-button">移除头像</button><small>PNG、JPG、WebP 或 GIF，最大 1 MB</small></div></div><label>显示名称<input name="name" maxlength="80" placeholder="留空，之后再填写"></label><label>个性签名<textarea name="signature" maxlength="300" rows="3" placeholder="留空，之后再填写"></textarea></label><label>个人标签<input name="tags" placeholder="用逗号分隔，例如：阅读, 摄影"></label><label>首页标题<input name="title" maxlength="120"></label><label>首页介绍<textarea name="description" rows="3" maxlength="500"></textarea></label><label>封面名句<textarea name="coverQuote" rows="2" maxlength="120" placeholder="把喜欢的事，留在日子里。"></textarea></label><label>名句署名<input name="coverAuthor" maxlength="120" placeholder="— 写给每一个普通的日子"></label><label>封面壁纸<input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>可选 PNG、JPG、WebP 或 GIF，最大 3 MB；仅保存在本机。</small></label><button type="button" id="remove-cover" class="text-button">恢复默认壁纸</button><button class="button primary" type="submit">保存首页资料</button></form></section><section class="editor-panel glass" id="posts" hidden><h2>文章</h2><p>新发布或修改文章会记录为一次博客贡献；未改动的重复保存不会计数。</p><form id="post-form"><label>选择文章<select name="selection"></select></label><label>文章标识<input name="slug" placeholder="例如 my-first-post" required><small>小写字母、数字和连字符，用于文章链接；已有文章请勿修改。</small></label><label>标题<input name="title" required maxlength="150"></label><label>分类<input name="category" maxlength="40" placeholder="随笔"></label><label>标签<input name="tags" placeholder="用逗号分隔"></label><label>摘要<textarea name="excerpt" rows="2" maxlength="300"></textarea></label><label>文章封面<input id="post-cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>选择图片后自动上传至本机，单张最大 10 MB。</small></label><div id="post-cover-preview" class="image-previews"></div><button type="button" id="remove-post-cover" class="text-button">移除封面</button><label>正文图片<input id="post-image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><small>选择图片后会插入到正文光标处，单张最大 10 MB。</small></label><label>正文（Markdown）<textarea name="body" rows="14" required></textarea></label><button class="button primary" type="submit">保存文章</button><button class="delete-content" id="delete-post" type="button" hidden>删除这篇文章</button></form></section><section class="editor-panel glass" id="moments" hidden><h2>生活动态</h2><p>发布或修改动态会记录为一次博客贡献。</p><form id="moment-form"><label>选择动态<select name="selection"></select></label><label>内容<textarea name="text" rows="6" required></textarea></label><label>动态图片<input id="moment-image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><small>最多 9 张，每张最大 10 MB。</small></label><div id="moment-image-preview" class="image-previews"></div><label>标签<input name="tags" placeholder="用逗号分隔"></label><button class="button primary" type="submit">保存动态</button><button class="delete-content" id="delete-moment" type="button" hidden>删除这条动态</button></form></section><section class="editor-panel glass" id="albums" hidden><h2>照片墙</h2><p>把照片按相册收集起来，第一张照片会作为封面。</p><form id="album-form"><label>选择相册<select name="selection"></select></label><label>相册名称<input name="title" maxlength="120" required></label><label>相册介绍<textarea name="description" rows="3" maxlength="500"></textarea></label><label>添加照片<input id="album-image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><small>每本相册最多 50 张，单张最大 10 MB。</small></label><div id="album-image-preview" class="image-previews"></div><button class="button primary" type="submit">保存相册</button></form></section><section class="editor-panel glass" id="projects" hidden><h2>项目与收藏</h2><p>添加或修改项目名称、说明和链接。</p><form id="project-form"><label>选择项目<select name="selection"></select></label><label>名称<input name="title" maxlength="150" required></label><label>分类<input name="category" maxlength="40"></label><label>介绍<textarea name="description" rows="4" maxlength="1000"></textarea></label><label>网址<input name="url" type="url" placeholder="https://"></label><button class="button primary" type="submit">保存项目</button></form></section><section class="editor-panel glass" id="about" hidden><h2>关于我</h2><p>填写简介、兴趣与经历。每条经历占一行，用竖线分隔日期、标题和内容。</p><form id="about-form"><label>个人简介<textarea name="about" rows="6" maxlength="5000"></textarea></label><label>个人链接<input name="github" type="url" placeholder="https://"></label><label>兴趣<input name="interests" placeholder="用逗号分隔"></label><label>经历<textarea name="timeline" rows="6" placeholder="2026 | 开始记录 | 在这里记录生活"></textarea></label><button class="button primary" type="submit">保存关于页</button></form></section></main><script src="editor.js"></script></body></html>
