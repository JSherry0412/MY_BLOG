<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>博客编辑器</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="editor.css"></head><body><main class="editor-shell"><header class="editor-header"><div><div class="eyebrow"><span></span> YOUR PERSONAL SPACE</div><h1>博客编辑器</h1><p>这里单独管理博客资料和内容。修改保存在本机博客文件中。</p></div><a class="button secondary" href="/" target="_blank" rel="noopener">打开博客 ↗</a></header><nav class="editor-nav" aria-label="编辑器栏目"><button data-panel="profile" class="selected">个人资料</button><button data-panel="posts">文章</button><button data-panel="moments">动态</button></nav><div id="notice" role="status" aria-live="polite"></div><section class="editor-panel glass" id="profile"><h2>个人资料</h2><p>你的头像、名字、签名和标签都可以稍后填写。</p><form id="profile-form"><div class="avatar-edit"><div id="avatar-preview" class="profile-avatar">✳</div><div><label class="upload-button" for="avatar-file">选择头像</label><input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><button type="button" id="remove-avatar" class="text-button">移除头像</button><small>PNG、JPG、WebP 或 GIF，最大 1 MB</small></div></div><label>显示名称<input name="name" maxlength="80" placeholder="留空，之后再填写"></label><label>个性签名<textarea name="signature" maxlength="300" rows="3" placeholder="留空，之后再填写"></textarea></label><label>个人标签<input name="tags" placeholder="用逗号分隔，例如：阅读, 摄影"></label><button class="button primary" type="submit">保存个人资料</button></form></section><section class="editor-panel glass" id="posts" hidden><h2>文章</h2><p>新发布或修改文章会记录为一次博客贡献；未改动的重复保存不会计数。</p><form id="post-form"><label>选择文章<select name="selection"></select></label><label>文章标识<input name="slug" placeholder="例如 my-first-post" required><small>小写字母、数字和连字符，用于文章链接；已有文章请勿修改。</small></label><label>标题<input name="title" required maxlength="150"></label><label>分类<input name="category" maxlength="40" placeholder="随笔"></label><label>标签<input name="tags" placeholder="用逗号分隔"></label><label>摘要<textarea name="excerpt" rows="2" maxlength="300"></textarea></label><label>正文（Markdown）<textarea name="body" rows="14" required></textarea></label><button class="button primary" type="submit">保存文章</button></form></section><section class="editor-panel glass" id="moments" hidden><h2>生活动态</h2><p>发布或修改动态会记录为一次博客贡献。</p><form id="moment-form"><label>选择动态<select name="selection"></select></label><label>内容<textarea name="text" rows="6" required></textarea></label><label>标签<input name="tags" placeholder="用逗号分隔"></label><button class="button primary" type="submit">保存动态</button></form></section></main><script src="editor.js"></script></body></html>
